name: Deploy to GitHub Pages

# Rebuilds and redeploys the site (the repo root is a static site, no build
# step needed). Runs on:
#   - push to master (human merges), and
#   - completion of the stats sync — a commit made by that workflow's
#     GITHUB_TOKEN does NOT trigger `on: push`, so we listen for the workflow
#     itself finishing instead.
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync stats from Google Sheet"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest, drop stale queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # On workflow_run, only deploy if the sync succeeded; always deploy on
    # a direct push or manual dispatch.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
