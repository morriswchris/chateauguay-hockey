name: Sync stats and deploy

# One sequential pipeline: pull the Google Sheet -> rebuild data/season.json
# -> build & deploy the site from that fresh data. Because it all runs in a
# single job, the deploy always uses the just-synced data (no double deploy,
# no ordering race).
#
# Setup (one time): publish each sheet tab via File -> Share -> Publish to web
# -> CSV, then add the URLs as repository *Variables* (Settings -> Secrets and
# variables -> Actions -> Variables):
#   STATS_CSV_URL     (required)  columns: Date, Player, Goals, Assists
#   SCHEDULE_CSV_URL  (optional)  columns: Date, Time, Rink [, Week, Note]
#   NEWS_CSV_URL      (optional)  columns: Date, Tag, Title, Body  (blank date = pinned)

on:
  push:
    branches: [master]      # every merge refreshes from the sheet and redeploys
  workflow_dispatch:        # "Run workflow" button for an instant refresh
  schedule:
    # Once daily at 16:00 UTC — 11am US Eastern in winter (EST) / 12pm in
    # summer (EDT). GitHub cron is UTC-only, so the wall-clock time shifts by
    # an hour across daylight saving; that's expected.
    - cron: '0 16 * * *'

permissions:
  contents: write           # to commit the refreshed season.json
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest, drop stale queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync season.json from the Google Sheet
        env:
          STATS_CSV_URL: ${{ vars.STATS_CSV_URL }}
          SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
          NEWS_CSV_URL: ${{ vars.NEWS_CSV_URL }}
        run: python scripts/build_season.py

      # Persist the refreshed data for history / source of truth. The deploy
      # below uses the working tree either way, so a push hiccup never blocks
      # publishing.
      - name: Commit refreshed data (if changed)
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/season.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/season.json
            git commit -m "Sync stats from Google Sheet"
            git push
            echo "Committed refreshed stats."
          else
            echo "No data changes."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
